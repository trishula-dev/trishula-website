project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"

website:
  title: "Trishula"
  description: "Trishula: an eBPF-native, developer-first WAF and API firewall for Kubernetes. Research project for adoption."
  site-url: https://trishula-dev.github.io/trishula-website/
  repo-url: https://github.com/trishula-dev/trishula-website
  repo-branch: main
  repo-actions: [edit, issue]
  open-graph: true
  navbar:
    background: dark
    pinned: true
    left:
      - href: index.qmd
        text: Home
    right:
      - icon: github
        href: https://github.com/trishula-dev

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
