  repo-url: https://github.com/trishula-dev/trishula-website
  repo-branch: main
  repo-actions: [edit, issue]
  open-graph: true
  navbar:
    background: dark
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: index.qmd#objectives
        text: Objectives
      - href: index.qmd#how-trishula-works
        text: Architecture
      - href: index.qmd#deployment-model
        text: Deployment
      - href: building.qmd
        text: Build
    right:
      - text: Recipes
        menu:
          - href: recipes.qmd
            text: All recipes
          - href: recipes-getting-started.qmd
            text: Getting started (1–3)
          - href: recipes-policy.qmd
            text: Policy and rules (4, 9, 11)
          - href: recipes-kernel.qmd
            text: Kernel enforcement (6, 7, 10)
          - href: recipes-crs-bench.qmd
            text: CRS and the bench (5, 8)
          - href: recipes-release.qmd
            text: Release and supply chain (12)
      - href: roadmap.qmd
        text: Roadmap
      - href: contributing.qmd
        text: Contributing
      - href: security.qmd
        text: Security
      - href: index.qmd#paper
        text: Paper
