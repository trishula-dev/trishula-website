name: site-check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render (fail on broken refs)
        run: quarto render
      - name: HTML present
        run: test -s index.html || test -s _site/index.html
      - name: Live-domain assert
        run: |
          CODE=0
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --compressed --max-time 15 https://trishula.dev/)
            [ "$CODE" = "200" ] && break
            sleep 20
          done
          test "$CODE" = "200" || { echo "trishula.dev serves HTTP $CODE, expected 200"; exit 1; }
          echo "trishula.dev serves 200"
