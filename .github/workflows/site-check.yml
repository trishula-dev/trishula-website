name: site-check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recipe gate self-test (RED fixtures -> OK, offline)
        run: python3 tests/test_recipe_gate.py
      - name: Recipe gate (anatomy + provenance + no-invented-evidence + ramp counts)
        run: python3 tools/recipe_gate.py --report tools/recipe-gate-report.json
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recipe-gate-report
          path: tools/recipe-gate-report.json
          retention-days: 7
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
      - name: Render (fail on broken refs)
        run: quarto render
      - name: HTML present
        run: test -s index.html || test -s _site/index.html
      - name: Live-domain assert
        run: |
          CODE=0
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --compressed --max-time 15 https://trishula.dev/)
            [ "$CODE" = "200" ] && break
            sleep 20
          done
          test "$CODE" = "200" || { echo "trishula.dev serves HTTP $CODE, expected 200"; exit 1; }
          echo "trishula.dev serves 200"
